<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>File not found — FileShelf</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        color-scheme: light;
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f8fafc;
        color: #0f172a;
        padding: 24px;
      }
      main {
        max-width: 30rem;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        padding: 32px;
        text-align: center;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.125rem;
      }
      p {
        margin: 0 0 8px;
        font-size: 0.875rem;
        line-height: 1.6;
        color: #475467;
      }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.8125rem;
        background: #f1f5f9;
        border-radius: 4px;
        padding: 2px 6px;
      }
      a {
        display: inline-block;
        margin-top: 16px;
        color: #1d4ed8;
        font-size: 0.875rem;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>This file is not in the library</h1>
      <p>
        The URL you opened does not match any asset in <code>public/files/</code>, so nothing was served. It may have
        been renamed, removed, or never committed.
      </p>
      <p>Nothing here is hidden behind a sign-in — a missing file is a genuine 404.</p>
      <a href="/">← Back to the FileShelf library</a>
    </main>
  </body>
</html>
